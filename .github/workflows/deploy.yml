name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Restore Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: first-tribes-android-debug-keystore-v1

      - name: Ensure persistent debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Capacitor Android project
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          rm -rf android
          npx cap add android
          node scripts/configure-android.mjs
          npx cap sync android

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure Gradle Maven Central mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/maven-mirror.gradle
          def mirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2"
          def patchRepos = { RepositoryHandler repos ->
            repos.withType(MavenArtifactRepository).configureEach { repo ->
              def u = repo.url.toString()
              if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                repo.setUrl(mirrorUrl)
              }
            }
          }
          gradle.settingsEvaluated { settings ->
            patchRepos(settings.pluginManagement.repositories)
            patchRepos(settings.dependencyResolutionManagement.repositories)
          }
          allprojects {
            patchRepos(buildscript.repositories)
            patchRepos(repositories)
          }
          EOF

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --max-workers=2 --no-daemon

      - name: Copy APK into dist
        run: cp android/app/build/outputs/apk/debug/app-debug.apk dist/FirstTribes.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FirstTribes-APK
          path: dist/FirstTribes.apk

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
